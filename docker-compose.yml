# Local PostgreSQL for development and tests:
#   docker compose up -d
# Creates `barber_booking` (dev) and `barber_booking_test` (tests).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barber_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber_booking"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
